# galleon-deck: the Galleon 100 SD's Stream Deck. Edit with the "Galleon Deck"
# app (galleon-deck-config) or by hand; saved changes apply within a second and
# mistakes show on the deck's screen instead of crashing it.
#
#   config.toml          this file: global settings and auto-switching
#   profiles/*.toml      one file per profile: its theme and pages of keys
#   themes/*.toml        optional: your own themes, or overrides of built-in ones.
#                        A theme sets bg, key_bg, fg, accent, dim, border, frame,
#                        radius, border_width, font, clock_font, and optionally
#                        key_style = "hud": cut corners with bright corner ticks
#                        (colour `tick`), where radius is the size of the cut.
#
# Built-in themes: amber (the default), cyberpunk, synthwave, matrix, arctic,
# hud, mono, plus "wallpaper", generated from your wallpaper (see below).
# Every profile also gets a generated "settings" page (last page) with a key
# per theme, one that builds a theme from your wallpaper, brightness -/+, and a
# key per profile.
#
# Keys on a page are listed left to right, top to bottom: 3 across, 4 down.
# An empty {} leaves a key blank. Each key takes a look and an action:
#
#   look:    label = "text"      icon = "\U000F0XXX" (any Nerd Font glyph)
#            image = "icons/x.png" (relative to this folder)
#            fg / bg / border = "#rrggbb", or a theme colour: "accent", "dim", ...
#   action:  key     = "KP7"                 a single key, held while you hold it
#            keys    = "SUPER+SHIFT+S"       a shortcut
#            exec    = "firefox"             run a command
#            confirm = true                  with exec: flash ✓ done / ✗ failed when it finishes
#            media   = "play-pause"          play-pause, next, previous, stop
#            page    = "apps" | "back"       switch page
#            profile = "gaming"              switch profile
#
# Key names are Linux input names without KEY_: A, F5, ENTER, KP0-KP9, KPDOT,
# KPENTER, KPPLUS, KPMINUS, KPASTERISK, KPSLASH, VOLUMEUP, ...
#
# Dials: left turns volume / press mutes. Right turns through pages / press
# returns to the profile's start page / hold it and turn to switch profile.

start_profile = "desktop"
brightness = 70
volume_step = 2        # percent per dial click
clock_format = "%H:%M"

# Switch profile by the focused window (Hyprland, Sway, i3, niri and X11
# desktops; not yet on GNOME or KDE Plasma under Wayland). Rules are
# checked in order; `class` and `title` are regular expressions. A profile you
# pick by hand stays until you focus something that maps elsewhere.
# A profile can also carry its own rules, checked before these, with a
# top-level `auto_switch = [{ class = "^mygame$" }]` in its file; add-ons use
# that so their rule comes and goes with them.
[auto_switch]
fallback = "desktop"   # profile for windows no rule matches
rules = [
  { class = "^(steam_app_.*|gamescope)$", profile = "gaming" },
]

# Profile switch: a short glitch, the new profile's logo resolving on the top
# screen while its keys come out of the interference. Any key or dial skips it.
# The logo is the profile's own `logo = "pictures/org.png"` (relative to this
# folder, or an absolute path); without one, the profile's name is the logo.
[transition]
enabled = true
speed = 1.0                        # 2.0 = twice as fast, 0.5 = half speed
hold = 0.5                         # seconds the logo stays up once it has resolved

# Boot animation: plays when you log in and whenever the keyboard is plugged
# in; any key or dial skips it. Uses the start profile's theme.
[boot]
enabled = true
speed = 1.0                        # 0.5 = half speed
title = "GALLEON DECK"
lines = [                          # "LABEL|STATUS", up to 6
  "DECK LINK 1B1C:2B18|OK",
  "PROFILES|LOADED",
  "KEYS|ENCRYPTED",
  "DIALS|READY",
]
# logo = "~/Pictures/logo.png"     # a transparent PNG; without one the title is the logo
# gif = "~/Videos/intro.gif"       # play your own GIF/APNG/WebP instead

# Theme from your wallpaper (the settings page's wallpaper key, or
# galleon-deck --theme-from-wallpaper). The wallpaper is found through
# noctalia, swww, hyprpaper or GNOME; set `command` for anything else.
[wallpaper_theme]
auto = false                       # true: regenerate whenever the wallpaper changes
# command = "swww query"           # anything that prints the wallpaper's path
font = "Quantico"
clock_font = "Quantico:bold"
